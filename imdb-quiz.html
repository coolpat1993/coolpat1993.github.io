<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast quiz image maker</title>
<style>
  :root{
    --bg:#15171c; --panel:#1d2027; --line:#2e333d; --text:#eceef2; --muted:#9aa1ae;
    --accent:#f2b705; --accent-ink:#1a1400; --ok:#6fd39a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
  .app{display:grid;grid-template-columns:420px 1fr;gap:20px;max-width:1500px;margin:0 auto;padding:16px}
  @media (max-width:980px){.app{grid-template-columns:1fr}}
  .sub{color:var(--muted);margin:0 0 18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  label{display:block;font-weight:600;margin:0 0 6px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .row>.fit{flex:0 0 auto}
  input[type=text],input[type=url],input[type=number],textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#12141a;color:var(--text);font:inherit}
  textarea{min-height:90px;resize:vertical;font-size:12px}
  input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#272b34;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:#30353f}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.primary:hover{background:#ffc82b}
  button:disabled{opacity:.5;cursor:not-allowed}
  .check{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:400}
  .check input{width:18px;height:18px}
  .castlist{max-height:380px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
  .castitem{display:grid;grid-template-columns:20px 22px 44px 1fr;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
  .castitem.dragging{background:#2a2f3a;box-shadow:0 4px 14px rgba(0,0,0,.5);position:relative;z-index:2}
  .handle{cursor:grab;touch-action:none;user-select:none;color:var(--muted);font-size:20px;line-height:1;text-align:center;padding:6px 0}
  .handle:hover{color:var(--text)}
  .castitem.dragging .handle{cursor:grabbing;color:var(--accent)}
  .castitem:last-child{border-bottom:0}
  .castitem img,.castitem .ph{width:44px;height:58px;object-fit:cover;border-radius:4px;background:#0d0f13}
  .castitem .nm{font-weight:600;font-size:14px;line-height:1.2}
  .castitem .ch{font-size:12px;color:var(--muted)}
  .castitem input.nm{min-width:0;padding:4px 8px;font-size:14px;font-weight:600;border-radius:6px;margin-bottom:2px}
  .castitem input[type=checkbox]{width:18px;height:18px}
  .colors{display:flex;gap:12px}
  .colors label{flex:1;font-weight:400;font-size:13px;color:var(--muted)}
  .colors input{width:100%;height:36px;padding:2px;border-radius:6px;border:1px solid var(--line);background:#12141a}
  .stage{position:sticky;top:16px;align-self:start}
  .canvaswrap{background:#0d0f13;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:center}
  canvas{max-width:100%;max-height:calc(100vh - 110px);height:auto;width:auto;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:13px}

  /* Side by side: never taller than the window.
     Left column (3 boxes) = same height as the image; Download button sits under the image. */
  @media (min-width:981px){
    html,body{height:100%;overflow:hidden}
    .app{height:100vh;max-width:none;grid-template-columns:420px 1fr;grid-template-rows:minmax(0,1fr) auto;gap:12px 20px}
    .stage{display:contents}
    .controls{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:12px;min-height:0}
    .controls .panel{margin-bottom:0}
    #castPanel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
    #castPanel .castlist{flex:1 1 auto;min-height:0;max-height:none}
    .canvaswrap{grid-column:2;grid-row:1;min-width:0;min-height:0;padding:0;border:0;background:none;align-items:center}
    canvas{height:100%;width:auto;max-width:100%;max-height:none;object-fit:contain;flex:none}
    .meta{grid-column:2;grid-row:2;margin-top:0}
  }
</style>
</head>
<body>
<div class="app">
  <div class="controls">
    <div class="panel">
      <div class="field">
        <div class="row">
          <input id="url" type="url" aria-label="IMDb page link" placeholder="IMDb title or person link">
          <button id="loadBtn" class="primary fit">Load IMDb page</button>
        </div>
      </div>
    </div>

    <div class="panel" id="castPanel">
      <div class="field">
        <div class="row">
          <input id="count" type="number" aria-label="Number of cast members (minimum 3)" title="Number of cast members (minimum 3)" min="3" value="6">
          <button id="shuffleBtn" class="fit" title="Randomise the order of the chosen cast">Shuffle order</button>
        </div>
      </div>
      <div class="castlist" id="castList"></div>
    </div>

    <div class="panel">
      <label class="check"><input type="checkbox" id="showNames" checked> <span id="showNamesText">Show actor names</span></label>
      <label class="check"><input type="checkbox" id="showChars"> Show character names (can give the film away)</label>
      <div class="colors" style="margin-top:12px">
        <label>Background top <input type="color" id="bg1" value="#1b1f2a"></label>
        <label>Background bottom <input type="color" id="bg2" value="#0c0e13"></label>
        <label>Accent <input type="color" id="accent" value="#00cfff"></label>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv" width="1280" height="1840"></canvas></div>
    <div class="meta">
      <span id="sizeInfo">1280 × 1840 px</span>
      <button id="dlBtn" class="primary">Download PNG</button>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 1280, H = 1840;
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const TMDB_KEY_STORAGE = 'imdb-quiz.tmdb-api-key';

  let cast = [];       // {id,name,character,imgUrl,img,checked}
  let loadToken = 0;
  let filmTitle = '', filmId = '';   // used only for the download file name, never drawn on the image
  function setTitle(t) { filmTitle = t || ''; }

  /* ---------- helpers ---------- */
  function parseImdbId(url) {
    const m = String(url).match(/(?:tt|nm)\d{6,9}/i);
    return m ? m[0].toLowerCase() : null;
  }
  async function getJSON(url, ms = 20000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) {
        const error = new Error('HTTP ' + res.status);
        error.status = res.status;
        throw error;
      }
      return await res.json();
    } finally { clearTimeout(t); }
  }

  /* ---------- TMDB lookup ---------- */
  async function castFromTMDB(ttId, apiKey) {
    const findUrl = 'https://api.themoviedb.org/3/find/' + encodeURIComponent(ttId) +
      '?external_source=imdb_id&api_key=' + encodeURIComponent(apiKey);
    const found = await getJSON(findUrl);
    const title = found.movie_results && found.movie_results[0];
    const series = found.tv_results && found.tv_results[0];
    const result = title || series;
    if (!result) return [];

    setTitle(result.title || result.name || '');
    const type = title ? 'movie' : 'tv';
    const credits = await getJSON('https://api.themoviedb.org/3/' + type + '/' +
      encodeURIComponent(result.id) + '/credits?api_key=' + encodeURIComponent(apiKey));
    return (credits.cast || [])
      .map(person => ({
        id: person.id,
        source: 'tmdb',
        name: person.name,
        character: person.character || '',
        imgUrl: person.profile_path ? 'https://image.tmdb.org/t/p/w500' + person.profile_path : '',
        order: person.order
      }))
      .sort((a, b) => a.order - b.order);
  }

  async function filmsFromTMDB(nmId, apiKey) {
    const findUrl = 'https://api.themoviedb.org/3/find/' + encodeURIComponent(nmId) +
      '?external_source=imdb_id&api_key=' + encodeURIComponent(apiKey);
    const found = await getJSON(findUrl);
    const person = found.person_results && found.person_results[0];
    if (!person) return [];

    setTitle(person.name || '');
    const credits = await getJSON('https://api.themoviedb.org/3/person/' +
      encodeURIComponent(person.id) + '/movie_credits?api_key=' + encodeURIComponent(apiKey));
    const seen = new Set();
    return (credits.cast || [])
      .filter(film => {
        if (!film.poster_path || seen.has(film.id)) return false;
        seen.add(film.id);
        return true;
      })
      .map(film => ({
        id: film.id,
        source: 'tmdb-film',
        name: film.title,
        character: '',
        imgUrl: 'https://image.tmdb.org/t/p/w500' + film.poster_path,
        order: film.release_date || ''
      }))
      .sort((a, b) => b.order.localeCompare(a.order));
  }

  async function resolveWikimediaFiles(imageFiles) {
    let failures = 0;
    const norm = value => value.replace(/_/g, ' ').trim().toLowerCase();
    for (let i = 0; i < imageFiles.length; i += 25) {
      const chunk = imageFiles.slice(i, i + 25);
      const titles = chunk.map(item => 'File:' + item.file).join('|');
      try {
        const data = await getJSON('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
          '&prop=imageinfo&iiprop=url&iiurlwidth=900&titles=' + encodeURIComponent(titles));
        const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
        const thumbnails = new Map();
        pages.forEach(page => {
          const image = page.imageinfo && page.imageinfo[0];
          if (image) thumbnails.set(norm(page.title.replace(/^File:/i, '')), image.thumburl || image.url);
        });
        chunk.forEach(item => {
          const url = thumbnails.get(norm(item.file));
          if (url) {
            item.person.wikimediaImgUrls = item.person.wikimediaImgUrls || [];
            item.person.wikimediaImgUrls.push(url);
          }
        });
      } catch (e) {
        failures++;
      }
    }
    return failures;
  }

  function wikimediaFileFromUrl(url) {
    const match = url.match(/Special:FilePath\/([^?]+)/);
    if (!match) return '';
    try { return decodeURIComponent(match[1]).replace(/_/g, ' '); }
    catch (e) { return match[1].replace(/_/g, ' '); }
  }

  async function addWikimediaPhotoFallback(people, apiKey) {
    let failures = 0;
    const byImdbId = new Map();
    for (let i = 0; i < people.length; i += 8) {
      const results = await Promise.allSettled(people.slice(i, i + 8).map(async person => {
        const externalIds = await getJSON('https://api.themoviedb.org/3/person/' +
          encodeURIComponent(person.id) + '/external_ids?api_key=' + encodeURIComponent(apiKey));
        return { person, imdbId: externalIds.imdb_id };
      }));
      results.forEach(result => {
        if (result.status === 'rejected') { failures++; return; }
        const { person, imdbId } = result.value;
        if (imdbId && /^nm\d{6,9}$/i.test(imdbId)) {
          person.imdbId = imdbId.toLowerCase();
          byImdbId.set(person.imdbId, person);
        }
      });
    }
    if (!byImdbId.size) return failures;

    const ids = [...byImdbId.keys()];
    const query = `SELECT ?imdbId ?image WHERE {
      VALUES ?imdbId { ${ids.map(id => '"' + id + '"').join(' ')} }
      ?person wdt:P345 ?imdbId; wdt:P18 ?image.
    }`;
    let rows;
    try {
      const data = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(query), 30000);
      rows = data.results && data.results.bindings || [];
    } catch (e) {
      return failures + 1;
    }
    const imageFiles = [];
    rows.forEach(row => {
      const person = byImdbId.get(row.imdbId.value.toLowerCase());
      const file = wikimediaFileFromUrl(row.image.value);
      if (person && file) imageFiles.push({ person, file });
    });
    return failures + await resolveWikimediaFiles(imageFiles);
  }

  async function castFromWikidata(ttId) {
    const query = `
      SELECT ?actor ?actorLabel ?imdbId ?img ?links (GROUP_CONCAT(DISTINCT ?charLabel; separator=" / ") AS ?chars) WHERE {
        ?film wdt:P345 "${ttId}".
        ?film p:P161 ?st.
        ?st ps:P161 ?actor.
        ?actor wdt:P18 ?img.
        ?actor wikibase:sitelinks ?links.
        OPTIONAL { ?actor wdt:P345 ?imdbId. }
        OPTIONAL { ?st pq:P453 ?char. ?char rdfs:label ?charLabel. FILTER(LANG(?charLabel) = "en") }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      }
      GROUP BY ?actor ?actorLabel ?imdbId ?img ?links
      ORDER BY DESC(?links)
      LIMIT 80`;
    const data = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(query), 30000);
    const rows = data.results && data.results.bindings || [];
    const peopleById = new Map();
    const imageFiles = [];
    rows.forEach(row => {
      const id = row.actor.value;
      let person = peopleById.get(id);
      if (!person) {
        const imdbId = row.imdbId && row.imdbId.value;
        person = {
          id,
          source: 'wikidata',
          imdbId: imdbId && /^nm\d{6,9}$/i.test(imdbId) ? imdbId.toLowerCase() : '',
          name: row.actorLabel.value,
          character: row.chars ? row.chars.value : '',
          imgUrl: '',
          wikimediaImgUrls: []
        };
        peopleById.set(id, person);
      }
      const file = wikimediaFileFromUrl(row.img.value);
      if (file) imageFiles.push({ person, file });
    });
    const failures = await resolveWikimediaFiles(imageFiles);
    return { people: [...peopleById.values()], failures };
  }

  function mergeCastLists(primary, supplemental) {
    const normalizeName = name => String(name).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
    const byId = new Map(primary.filter(person => person.imdbId).map(person => [person.imdbId, person]));
    const byName = new Map(primary.map(person => [normalizeName(person.name), person]).filter(([name]) => name));
    const additions = [];
    supplemental.forEach(person => {
      const imdbId = person.imdbId || '';
      const name = normalizeName(person.name);
      const duplicate = (imdbId && byId.get(imdbId)) || (name && byName.get(name));
      if (duplicate) {
        if (!duplicate.imdbId && imdbId) duplicate.imdbId = imdbId;
        if (!duplicate.character && person.character) duplicate.character = person.character;
        if (person.wikimediaImgUrls && person.wikimediaImgUrls.length) {
          duplicate.wikimediaImgUrls = [...new Set([...(duplicate.wikimediaImgUrls || []), ...person.wikimediaImgUrls])];
        }
        return;
      }
      additions.push(person);
      if (imdbId) byId.set(imdbId, person);
      if (name) byName.set(name, person);
    });
    return primary.concat(additions);
  }

  /* ---------- images ---------- */
  function sized(url) { return url.replace(/\._V1_.*(\.\w+)$/, '._V1_UY1000_$1'); }
  function tryLoad(src, cors) {
    return new Promise((res, rej) => {
      const i = new Image();
      if (cors) i.crossOrigin = 'anonymous';
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('img'));
      i.src = src;
    });
  }
  async function loadImage(url) {
    for (const u of [sized(url), url]) { try { return await tryLoad(u, true); } catch (e) {} }
    return null;
  }

  /* ---------- loading flow ---------- */
  async function setCast(people, apiKey, isFilmography) {
    if (!people.length) throw new Error(isFilmography ? 'No film posters found.' : 'No cast members found.');
    const token = ++loadToken;
    const loadingCast = people.map(p => ({ ...p, img: null, checked: false }));
    cast = [];
    renderList();
    draw();
    await Promise.all(loadingCast.map(async c => {
      c.img = c.imgUrl ? await loadImage(c.imgUrl) : null;
    }));
    if (token !== loadToken) return;
    const needsFallback = isFilmography ? [] : loadingCast.filter(c => !c.img);
    await Promise.all(needsFallback.map(async c => {
      for (const url of c.wikimediaImgUrls || []) {
        c.img = await loadImage(url);
        if (c.img) break;
      }
    }));
    const needsPersonLookup = needsFallback.filter(c => !c.img && c.source === 'tmdb');
    const fallbackFailures = await addWikimediaPhotoFallback(needsPersonLookup, apiKey);
    await Promise.all(needsPersonLookup.map(async c => {
      for (const url of c.wikimediaImgUrls || []) {
        c.img = await loadImage(url);
        if (c.img) break;
      }
    }));
    if (token !== loadToken) return;
    cast = loadingCast.filter(c => c.img);
    if (fallbackFailures) {
      window.alert('Wikimedia photo lookup failed for ' + fallbackFailures + ' request(s). Available cast photos were kept.');
    }
    if (!cast.length) throw new Error(isFilmography ? 'No film posters could be loaded.' : 'No TMDB or Wikimedia cast photos could be loaded.');
    const n = Math.max(3, Math.min(+$('count').value || 6, cast.length));
    $('castPanel').hidden = false;
    $('count').max = cast.length;
    $('count').value = n;
    cast.forEach((c, i) => c.checked = i < n);
    renderList();
    draw();
  }

  function setDisplayMode(isFilmography) {
    $('showNamesText').textContent = isFilmography ? 'Show film titles' : 'Show actor names';
    $('showChars').parentElement.hidden = isFilmography;
    $('count').setAttribute('aria-label', isFilmography ? 'Number of films (minimum 3)' : 'Number of cast members (minimum 3)');
    $('count').title = isFilmography ? 'Number of films (minimum 3)' : 'Number of cast members (minimum 3)';
    $('shuffleBtn').title = isFilmography ? 'Randomise the order of the chosen films' : 'Randomise the order of the chosen cast';
  }

  function savedTMDBKey() {
    try { return localStorage.getItem(TMDB_KEY_STORAGE) || ''; }
    catch (e) { return ''; }
  }
  function promptForTMDBKey(message) {
    const value = window.prompt(message);
    if (value === null || !value.trim()) return '';
    const key = value.trim();
    try { localStorage.setItem(TMDB_KEY_STORAGE, key); }
    catch (e) { window.alert('The TMDB API key could not be saved in this browser. You will be asked for it again next time.'); }
    return key;
  }

  async function loadFromUrl() {
    const id = parseImdbId($('url').value);
    if (!id) return;
    const isFilmography = id.startsWith('nm');
    let apiKey = savedTMDBKey();
    if (!apiKey) apiKey = promptForTMDBKey('Enter your TMDB API key:');
    if (!apiKey) return;
    $('loadBtn').disabled = true; $('loadBtn').textContent = 'Loading…';
    try {
      setTitle(''); filmId = id;
      let people;
      try { people = isFilmography ? await filmsFromTMDB(id, apiKey) : await castFromTMDB(id, apiKey); }
      catch (e) {
        if (e.status !== 401) throw e;
        apiKey = promptForTMDBKey('TMDB rejected the saved API key. Enter a valid TMDB API key:');
        if (!apiKey) return;
        people = isFilmography ? await filmsFromTMDB(id, apiKey) : await castFromTMDB(id, apiKey);
      }
      let supplemental = { people: [], failures: 0 };
      if (!isFilmography) {
        try { supplemental = await castFromWikidata(id); }
        catch (e) {
          window.alert('Could not load additional cast from Wikidata (' + e.message + '). TMDB cast will still be used.');
        }
      }
      people = mergeCastLists(people, supplemental.people);
      if (supplemental.failures) {
        window.alert('Wikimedia images could not be resolved for ' + supplemental.failures + ' request(s).');
      }
      if (!people.length) {
        window.alert(isFilmography
          ? 'TMDB did not find any films for that IMDb person.'
          : 'TMDB and Wikidata did not find any cast members for that IMDb title.');
        return;
      }
      await setCast(people, apiKey, isFilmography);
      setDisplayMode(isFilmography);
    } catch (e) {
      if (e.status === 401) window.alert('TMDB rejected the API key. Check it and try again.');
      else if (isFilmography) window.alert('Couldn’t load film posters from TMDB (' + e.message + '). Check the API key and your connection, then try again.');
      else window.alert('Couldn’t load the cast from TMDB (' + e.message + '). Check the API key and your connection, then try again.');
    } finally { $('loadBtn').disabled = false; $('loadBtn').textContent = 'Load IMDb page'; }
  }

  /* ---------- cast list UI ---------- */
  function renderList() {
    const box = $('castList'); box.innerHTML = '';
    cast.forEach((c, i) => {
      const row = document.createElement('div'); row.className = 'castitem'; row._c = c;

      const handle = document.createElement('div'); handle.className = 'handle'; handle.textContent = '⠿';
      handle.title = 'Drag to reorder'; handle.setAttribute('aria-label', 'Drag to reorder ' + c.name);
      const onMove = e => {
        const rows = [...box.children].filter(r => r !== row);
        const next = rows.find(r => { const bb = r.getBoundingClientRect(); return e.clientY < bb.top + bb.height / 2; });
        if (next) { if (row.nextSibling !== next) box.insertBefore(row, next); }
        else if (box.lastChild !== row) box.appendChild(row);
        const lb = box.getBoundingClientRect();
        if (e.clientY < lb.top + 24) box.scrollTop -= 12;
        else if (e.clientY > lb.bottom - 24) box.scrollTop += 12;
        cast = [...box.children].map(r => r._c);   // update order and image while dragging
        draw();
      };
      const onEnd = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onEnd);
        window.removeEventListener('pointercancel', onEnd);
        row.classList.remove('dragging');
        cast = [...box.children].map(r => r._c);
        renderList(); draw();
      };
      handle.addEventListener('pointerdown', e => {
        e.preventDefault();
        row.classList.add('dragging');
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onEnd);
        window.addEventListener('pointercancel', onEnd);
      });

      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'cast-include-' + i; cb.checked = c.checked;
      cb.setAttribute('aria-label', 'Include ' + c.name);
      cb.onchange = () => { c.checked = cb.checked; syncCount(); draw(); };
      let thumb;
      if (c.img) { thumb = document.createElement('img'); thumb.src = c.img.src; thumb.alt = ''; }
      else { thumb = document.createElement('div'); thumb.className = 'ph'; }
      const info = document.createElement('div');
      const nm = document.createElement('input'); nm.type = 'text'; nm.id = 'cast-name-' + i; nm.className = 'nm'; nm.value = c.name;
      nm.setAttribute('aria-label', 'Name for this cast member');
      nm.addEventListener('input', () => { c.name = nm.value; draw(); });
      const ch = document.createElement('div'); ch.className = 'ch'; ch.textContent = c.character;
      info.append(nm, ch);
      row.append(handle, cb, thumb, info);
      box.appendChild(row);
    });
  }
  function syncCount() { $('count').value = Math.max(3, cast.filter(c => c.checked).length); }
  function applyCount() {
    const n = Math.max(3, Math.min(+$('count').value || 3, cast.length || 3));
    $('count').value = n;
    cast.forEach((c, i) => c.checked = i < n);
    renderList(); draw();
  }
  function shuffleChosen() {
    const chosen = cast.filter(c => c.checked);
    for (let i = chosen.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [chosen[i], chosen[j]] = [chosen[j], chosen[i]];
    }
    cast = chosen.concat(cast.filter(c => !c.checked));
    renderList(); draw();
  }

  /* ---------- drawing ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fitText(text, maxW, start, min, weight) {
    let s = start;
    ctx.font = weight + ' ' + s + 'px "Trebuchet MS","Segoe UI",sans-serif';
    while (ctx.measureText(text).width > maxW && s > min) {
      s -= 2; ctx.font = weight + ' ' + s + 'px "Trebuchet MS","Segoe UI",sans-serif';
    }
    return s;
  }
  function pickLayout(n, gw, gh, gap) {
    let best = null;
    for (let c = 1; c <= 5; c++) {
      const rows = Math.ceil(n / c);
      const cw = (gw - (c - 1) * gap) / c;
      const ch = (gh - (rows - 1) * gap) / rows;
      const score = Math.abs(Math.log((cw / ch) / 0.78)) + 0.05 * (rows * c - n);
      if (!best || score < best.score) best = { c, rows, cw, ch, score };
    }
    return best;
  }
  function drawCover(img, x, y, w, h) {
    const ir = img.width / img.height, br = w / h;
    let sw, sh, sx, sy;
    if (ir > br) { sh = img.height; sw = sh * br; sx = (img.width - sw) / 2; sy = 0; }
    else { sw = img.width; sh = sw / br; sx = 0; sy = (img.height - sh) * 0.18; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function draw() {
    const accent = $('accent').value;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, $('bg1').value); g.addColorStop(1, $('bg2').value);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const pad = 40, gap = 26;
    const top = pad, bottom = H - pad;

    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

    const chosen = cast.filter(c => c.checked);
    if (!chosen.length) {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.font = '600 38px "Trebuchet MS","Segoe UI",sans-serif';
      ctx.fillText('Load an IMDb link to see the images here', W / 2, (top + bottom) / 2);
      return;
    }

    const gw = W - pad * 2, gh = bottom - top;
    const L = pickLayout(chosen.length, gw, gh, gap);
    const showNames = $('showNames').checked, showChars = $('showChars').checked;

    chosen.forEach((c, i) => {
      const row = Math.floor(i / L.c), col = i % L.c;
      const inRow = row === L.rows - 1 ? chosen.length - (L.rows - 1) * L.c : L.c;
      const rowW = inRow * L.cw + (inRow - 1) * gap;
      const x = pad + (gw - rowW) / 2 + col * (L.cw + gap);
      const y = top + row * (L.ch + gap);

      ctx.save();
      rr(x, y, L.cw, L.ch, 22); ctx.clip();
      ctx.fillStyle = '#0b0d11'; ctx.fillRect(x, y, L.cw, L.ch);
      if (c.img) drawCover(c.img, x, y, L.cw, L.ch);
      else {
        ctx.fillStyle = 'rgba(255,255,255,.12)';
        ctx.font = '700 64px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(c.name.split(' ').map(w => w[0]).join('').slice(0, 3), x + L.cw / 2, y + L.ch / 2);
      }
      if (showNames) {
        const hasChar = showChars && c.character;
        const barH = hasChar ? 130 : 96;
        const gr = ctx.createLinearGradient(0, y + L.ch - barH - 50, 0, y + L.ch);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.55, 'rgba(0,0,0,.78)'); gr.addColorStop(1, 'rgba(0,0,0,.92)');
        ctx.fillStyle = gr; ctx.fillRect(x, y + L.ch - barH - 50, L.cw, barH + 50);
        ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
        fitText(c.name, L.cw - 36, 44, 20, '800');
        ctx.fillText(c.name, x + L.cw / 2, hasChar ? y + L.ch - 58 : y + L.ch - 30);
        if (hasChar) {
          ctx.fillStyle = accent;
          fitText(c.character, L.cw - 36, 30, 16, '600');
          ctx.fillText(c.character, x + L.cw / 2, y + L.ch - 22);
        }
      }
      ctx.restore();
      ctx.lineWidth = 4; ctx.strokeStyle = accent; rr(x, y, L.cw, L.ch, 22); ctx.stroke();
    });
  }

  /* ---------- download ---------- */
  function slug(t) {
    return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'film';
  }
  function download() {
    try {
      cv.toBlob(b => {
        if (!b) { window.alert('Couldn’t export the image.'); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'imdb-quiz-' + slug(filmTitle || filmId || 'film') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
      }, 'image/png');
    } catch (e) {
      window.alert('The browser blocked the export because a photo came from another site. Untick that person and try again.');
    }
  }

  /* ---------- wire up ---------- */
  $('loadBtn').onclick = loadFromUrl;
  $('url').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromUrl(); });
  $('count').addEventListener('change', applyCount);
  $('shuffleBtn').onclick = shuffleChosen;
  $('dlBtn').onclick = download;
  ['showNames', 'showChars', 'bg1', 'bg2', 'accent'].forEach(id =>
    $(id).addEventListener('input', draw));
  draw();
})();
</script>
</body>
</html>
